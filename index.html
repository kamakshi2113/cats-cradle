<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neon Cat's Cradle</title>
<style>
  :root{--bg:#040a1c;--cyan:#00f0ff;--mag:#ff2bd6;--yel:#ffe14d;--txt:#8fa6e8}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--txt)}
  canvas{display:block}
  #video{display:none}

  /* CRT overlay */
  .vignette{pointer-events:none;position:fixed;inset:0;z-index:4;
    background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,10,.8) 100%)}
  .scan{pointer-events:none;position:fixed;inset:0;z-index:5;
    background:repeating-linear-gradient(to bottom,rgba(160,190,255,.05) 0 1px,transparent 1px 3px);
    animation:flick 3s steps(30) infinite}
  .sweep{pointer-events:none;position:fixed;left:0;right:0;height:22vh;z-index:5;
    background:linear-gradient(to bottom,transparent,rgba(120,160,255,.045),transparent);
    animation:sweep 8s linear infinite}
  @keyframes flick{0%,100%{opacity:.85}50%{opacity:1}}
  @keyframes sweep{from{top:-22vh}to{top:100vh}}

  /* HUD */
  #hud{position:fixed;top:20px;left:22px;z-index:6;font-size:11px;letter-spacing:.18em;
    text-transform:uppercase;line-height:1.9;transition:opacity .3s}
  #hud .title{color:#e6eeff;font-weight:600;letter-spacing:.32em;font-size:12px}
  #hud .title span{color:var(--cyan);text-shadow:0 0 8px var(--cyan)}
  #status::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;
    margin-right:9px;vertical-align:1px;background:var(--mag);box-shadow:0 0 8px var(--mag)}
  #status.ok::before{background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
  #hint{position:fixed;bottom:18px;left:22px;z-index:6;font-size:10px;letter-spacing:.2em;
    text-transform:uppercase;opacity:.55;transition:opacity .3s}
  #fps{position:fixed;top:20px;right:22px;z-index:6;font-size:10px;letter-spacing:.2em;opacity:.5}
  .hidden{opacity:0!important}

  /* Start screen */
  #start{position:fixed;inset:0;z-index:7;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:18px;background:radial-gradient(ellipse at center,#0a1638 0%,#040a1c 70%);
    text-align:center;padding:16px}
  #start h1{margin:0;font-size:clamp(22px,4vw,40px);font-weight:600;letter-spacing:.35em;color:#eaf1ff;
    text-shadow:0 0 18px rgba(0,240,255,.6),0 0 40px rgba(255,43,214,.35)}
  #start p{margin:0;max-width:420px;font-size:12px;letter-spacing:.12em;line-height:1.8}
  #start button{margin-top:8px;font:inherit;font-size:12px;letter-spacing:.3em;text-transform:uppercase;
    color:#eaffff;background:transparent;border:1px solid var(--cyan);padding:12px 28px;cursor:pointer;
    box-shadow:0 0 14px rgba(0,240,255,.45),inset 0 0 14px rgba(0,240,255,.2);transition:.2s}
  #start button:hover{background:rgba(0,240,255,.12);box-shadow:0 0 24px rgba(0,240,255,.8),inset 0 0 18px rgba(0,240,255,.3)}
  #start button:disabled{opacity:.5;cursor:wait}
  #err{color:var(--mag);font-size:12px;min-height:1em}
</style>
</head>
<body>
<video id="video" playsinline muted></video>

<div class="vignette"></div>
<div class="scan"></div>
<div class="sweep"></div>

<div id="hud">
  <div class="title">CAT'S <span>CRADLE</span></div>
  <div id="status">Standby</div>
</div>
<div id="fps"></div>
<div id="hint">W · weave pattern &nbsp;&nbsp; H · hide interface</div>

<div id="start">
  <h1>CAT'S CRADLE</h1>
  <p>Raise both hands to the camera. Neon strings link your fingertips — pull apart to tighten them.</p>
  <button id="go">Enable camera</button>
  <div id="err"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js" crossorigin="anonymous"></script>
<script>
/* ---------- constants ---------- */
const TIPS = [4, 8, 12, 16, 20];
const BONES = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],
               [9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
const PALM = [0, 1, 5, 9, 13, 17];
const FINGER = i => i === 0 ? 0 : Math.min(4, Math.floor((i - 1) / 4)); // landmark -> finger 0..4
const STOPS = [[0,240,255],[255,43,214],[255,225,77]];                 // cyan, magenta, yellow
const PAIRS_STRAIGHT = TIPS.map(t => [t, t]);
const PAIRS_WEAVE = [[4,4],[8,16],[16,8],[12,12],[20,20],[4,20],[20,4]];

/* ---------- state ---------- */
const video = document.getElementById('video');
const statusEl = document.getElementById('status');
const fpsEl = document.getElementById('fps');
let ctx, W, H, bgGrad;
let running = false, busy = false, weave = false;
let pairs = PAIRS_STRAIGHT;
let strings = [];
const slots = [makeSlot(), makeSlot()]; // 0 = left on screen, 1 = right on screen

function makeSlot(){ return { pts: null, alpha: 0, present: false, size: 1 }; }
function resetStrings(){ strings = pairs.map(() => ({ cx:0, cy:0, vx:0, vy:0, init:false })); }
resetStrings();

/* palette: u in [0,1] across cyan -> magenta -> yellow */
function pal(u){
  u = Math.max(0, Math.min(1, u)) * 2;
  const i = Math.min(1, Math.floor(u)), f = u - i, a = STOPS[i], b = STOPS[i + 1];
  return [a[0] + (b[0]-a[0])*f, a[1] + (b[1]-a[1])*f, a[2] + (b[2]-a[2])*f];
}
const rgba = (c, a) => `rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;

/* ---------- MediaPipe ---------- */
const hands = new Hands({ locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/${f}` });
hands.setOptions({ maxNumHands: 2, modelComplexity: 1, minDetectionConfidence: 0.6, minTrackingConfidence: 0.5 });
hands.onResults(onResults);

function toScreen(lms){
  // "cover" fit of the video into the window, then mirror horizontally
  const vw = video.videoWidth || 640, vh = video.videoHeight || 480;
  const s = Math.max(W / vw, H / vh), ox = (W - vw * s) / 2, oy = (H - vh * s) / 2;
  return lms.map(p => ({ x: W - (p.x * vw * s + ox), y: p.y * vh * s + oy }));
}
const meanX = pts => pts.reduce((a, p) => a + p.x, 0) / pts.length;

function onResults(res){
  const found = (res.multiHandLandmarks || []).map(toScreen);
  slots[0].present = slots[1].present = false;

  if (found.length >= 2){
    found.sort((a, b) => meanX(a) - meanX(b));
    assign(0, found[0]); assign(1, found[found.length - 1]);
  } else if (found.length === 1){
    const p = found[0], mx = meanX(p);
    let idx;
    if (slots[0].alpha > 0.2 && slots[1].alpha > 0.2)
      idx = Math.abs(meanX(slots[0].pts) - mx) < Math.abs(meanX(slots[1].pts) - mx) ? 0 : 1;
    else idx = mx < W / 2 ? 0 : 1;
    assign(idx, p);
  }
  const n = found.length;
  statusEl.textContent = n === 2 ? 'Link established' : n === 1 ? 'Show second hand' : 'Show both hands';
  statusEl.className = n === 2 ? 'ok' : '';
}

function assign(i, pts){
  const s = slots[i];
  if (s.pts && s.alpha > 0.1){
    const k = 0.6; // light smoothing to remove jitter while keeping latency low
    for (let j = 0; j < 21; j++){ s.pts[j].x += (pts[j].x - s.pts[j].x) * k; s.pts[j].y += (pts[j].y - s.pts[j].y) * k; }
  } else s.pts = pts;
  s.present = true;
  s.size = Math.hypot(s.pts[9].x - s.pts[0].x, s.pts[9].y - s.pts[0].y) || 1;
}

async function pump(){
  if (running && !busy && video.readyState >= 2){
    busy = true;
    try { await hands.send({ image: video }); } catch (e) { console.warn(e); }
    busy = false;
  }
  requestAnimationFrame(pump);
}

document.getElementById('go').addEventListener('click', async e => {
  const btn = e.currentTarget, err = document.getElementById('err');
  btn.disabled = true; btn.textContent = 'Starting…'; err.textContent = '';
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480, facingMode: 'user' }, audio: false });
    video.srcObject = stream; await video.play();
    statusEl.textContent = 'Loading hand model…';
    await hands.initialize();
    running = true; pump();
    document.getElementById('start').style.display = 'none';
  } catch (ex){
    console.error(ex);
    err.textContent = 'Camera unavailable — allow access and open this file in Chrome, Edge or Safari.';
    btn.disabled = false; btn.textContent = 'Try again';
  }
});

/* ---------- p5 ---------- */
function setup(){
  createCanvas(windowWidth, windowHeight);
  pixelDensity(1);
  frameRate(60);
  ctx = drawingContext;
  sizeUp();
  ctx.fillStyle = '#040a1c'; ctx.fillRect(0, 0, W, H);
}
function windowResized(){ resizeCanvas(windowWidth, windowHeight); sizeUp(); }
function sizeUp(){
  W = width; H = height;
  bgGrad = ctx.createRadialGradient(W/2, H*0.45, 0, W/2, H*0.45, Math.max(W, H) * 0.75);
  bgGrad.addColorStop(0, '#0b1a44'); bgGrad.addColorStop(0.55, '#06102b'); bgGrad.addColorStop(1, '#02050f');
}

function keyPressed(){
  if (key === 'w' || key === 'W'){ weave = !weave; pairs = weave ? PAIRS_WEAVE : PAIRS_STRAIGHT; resetStrings(); }
  if (key === 'h' || key === 'H') ['hud', 'hint', 'fps'].forEach(id => document.getElementById(id).classList.toggle('hidden'));
}

function draw(){
  // midnight background with slight persistence for motion trails
  ctx.globalCompositeOperation = 'source-over';
  ctx.shadowBlur = 0;
  ctx.globalAlpha = 0.42; ctx.fillStyle = bgGrad; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1;

  for (const s of slots) s.alpha += ((s.present ? 1 : 0) - s.alpha) * (s.present ? 0.25 : 0.08);

  for (const s of slots) if (s.pts && s.alpha > 0.02) drawSilhouette(s);

  ctx.globalCompositeOperation = 'lighter';
  const L = slots[0], R = slots[1];
  if (L.pts && R.pts && L.alpha > 0.02 && R.alpha > 0.02) drawStrings(L, R);
  for (const s of slots) if (s.pts && s.alpha > 0.02) drawJoints(s);
  ctx.globalCompositeOperation = 'source-over';
  ctx.shadowBlur = 0;

  if (frameCount % 30 === 0) fpsEl.textContent = Math.round(frameRate()) + ' FPS';
}

/* soft hand silhouette from landmarks (raw video stays hidden) */
function drawSilhouette(s){
  const p = s.pts, a = s.alpha;
  ctx.lineCap = ctx.lineJoin = 'round';

  ctx.beginPath();
  for (const [i, j] of BONES){ ctx.moveTo(p[i].x, p[i].y); ctx.lineTo(p[j].x, p[j].y); }
  ctx.strokeStyle = `rgba(70,110,235,${0.07 * a})`; ctx.lineWidth = s.size * 0.34; ctx.stroke(); // soft outer edge
  ctx.strokeStyle = `rgba(80,125,245,${0.11 * a})`; ctx.lineWidth = s.size * 0.24; ctx.stroke(); // body

  ctx.beginPath();
  PALM.forEach((k, n) => n ? ctx.lineTo(p[k].x, p[k].y) : ctx.moveTo(p[k].x, p[k].y));
  ctx.closePath();
  ctx.fillStyle = `rgba(80,125,245,${0.13 * a})`; ctx.fill();

  ctx.beginPath();
  for (const [i, j] of BONES){ ctx.moveTo(p[i].x, p[i].y); ctx.lineTo(p[j].x, p[j].y); }
  ctx.strokeStyle = `rgba(150,185,255,${0.22 * a})`; ctx.lineWidth = 1; ctx.stroke();               // faint skeleton
}

/* glowing neon dots on every joint, batched per finger colour */
function drawJoints(s){
  const p = s.pts, a = s.alpha, base = s.size * 0.045, t = millis() * 0.004;
  for (let f = 0; f < 5; f++){
    const c = pal(f / 4);
    ctx.shadowColor = rgba(c, a); ctx.shadowBlur = 14;
    ctx.fillStyle = rgba(c, 0.9 * a);
    ctx.beginPath();
    for (let i = 0; i < 21; i++){
      if (FINGER(i) !== f) continue;
      const tip = TIPS.includes(i);
      const r = Math.max(2, base * (tip ? 1.5 : 1) * (1 + 0.15 * Math.sin(t + i)));
      ctx.moveTo(p[i].x + r, p[i].y); ctx.arc(p[i].x, p[i].y, r, 0, Math.PI * 2);
    }
    ctx.fill();
  }
  // bright cores
  ctx.shadowBlur = 0; ctx.fillStyle = `rgba(255,255,255,${0.85 * a})`;
  ctx.beginPath();
  for (let i = 0; i < 21; i++){ const r = Math.max(1, base * 0.35); ctx.moveTo(p[i].x + r, p[i].y); ctx.arc(p[i].x, p[i].y, r, 0, Math.PI * 2); }
  ctx.fill();
}

/* elastic strings: spring-driven control point on a quadratic curve */
function drawStrings(L, R){
  const alpha = Math.min(L.alpha, R.alpha), dim = Math.min(W, H), now = millis() * 0.001;
  ctx.lineCap = 'round';

  pairs.forEach(([li, ri], idx) => {
    const a = L.pts[li], b = R.pts[ri], st = strings[idx];
    const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1;
    const t = Math.min(1, d / (dim * 1.1));                     // tension 0 (slack) .. 1 (taut)
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;

    let nx = -dy / d, ny = dx / d; if (ny < 0){ nx = -nx; ny = -ny; } // perpendicular, gravity side
    const sag = Math.max(0, dim * 0.55 - d) * 0.42 + 10 * (1 - t);
    let tx = mx + nx * sag, ty = my + ny * sag;
    if (t > 0.8){ const v = (t - 0.8) * 30 * Math.sin(now * 48 + idx * 1.3); tx += nx * v; ty += ny * v; } // taut hum

    if (!st.init){ st.cx = tx; st.cy = ty; st.init = true; }
    const k = 0.07 + 0.22 * t;
    st.vx = (st.vx + (tx - st.cx) * k) * 0.84;
    st.vy = (st.vy + (ty - st.cy) * k) * 0.84;
    st.cx += st.vx; st.cy += st.vy;
    const qx = 2 * st.cx - mx, qy = 2 * st.cy - my;             // curve passes through the spring point

    const off = idx * 0.035, c0 = pal(0.5 * t + off), c1 = pal(0.25 + 0.5 * t + off), c2 = pal(0.5 + 0.5 * t);
    const g = ctx.createLinearGradient(a.x, a.y, b.x, b.y);
    g.addColorStop(0, rgba(c0, alpha)); g.addColorStop(0.5, rgba(c1, alpha)); g.addColorStop(1, rgba(c2, alpha));
    const lw = (3.4 - 2.6 * t) * Math.max(0.8, dim / 800);

    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.quadraticCurveTo(qx, qy, b.x, b.y);
    ctx.strokeStyle = g; ctx.lineWidth = lw;
    ctx.shadowColor = rgba(c1, alpha); ctx.shadowBlur = 10 + 14 * (1 - t);
    ctx.stroke();

    ctx.shadowBlur = 0;                                         // hot white core
    ctx.strokeStyle = `rgba(255,255,255,${(0.35 + 0.35 * t) * alpha})`;
    ctx.lineWidth = Math.max(0.6, lw * 0.3);
    ctx.stroke();
  });
}
</script>
</body>
</html>
